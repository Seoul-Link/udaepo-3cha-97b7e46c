<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우대포블랙 명동점 3차 캠페인</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1c20;--line:#d5d8de;--accent:#0b5cad}
@media (prefers-color-scheme: dark){
  :root{--bg:#15171a;--card:#1f2226;--ink:#eef0f2;--line:#33373c;--accent:#5ea1e8}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  display:flex;justify-content:center;padding:32px 16px}
.wrap{max-width:420px;width:100%}
h1{font-size:19px;line-height:1.4;margin:0 0 20px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card p{margin:0 0 12px;font-size:14px;color:var(--ink);opacity:.75}
a.btn{display:block;text-align:center;padding:14px;border-radius:10px;background:var(--accent);color:#fff;
  text-decoration:none;font-size:15px;font-weight:600;margin-bottom:10px}
a.btn.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent)}
a.btn:last-child{margin-bottom:0}
.sect{font-size:13px;opacity:.6;margin:22px 0 8px;padding-left:2px}
</style></head>
<body>
<div class="wrap">
<h1>우대포블랙 명동점<br>3차 캠페인 계약서 · 견적서</h1>

<div class="sect">계약서</div>
<div class="card">
<p>3차 마케팅 대행 계약서</p>
<a class="btn" href="contract.html">계약서 보기</a>
<a class="btn secondary" href="contract.pdf" download>계약서 PDF 다운로드</a>
</div>

<div class="sect">견적서</div>
<div class="card">
<p>3차 캠페인 견적서</p>
<a class="btn" href="quote.html">견적서 보기</a>
<a class="btn secondary" href="quote.pdf" download>견적서 PDF 다운로드</a>
</div>

<div class="sect">서울링크 서류</div>
<div class="card">
<p>입금·세금계산서 발급용 서류입니다.</p>
<a class="btn secondary" href="https://www.dropbox.com/scl/fi/n907hvdzzqgxdpbopyrqn/1_-_.png?rlkey=w4xdal3uleiaz5ti4837vma28&dl=0" target="_blank" rel="noopener">사업자등록증 보기(드롭박스)</a>
</div>

</div>
</body></html>
